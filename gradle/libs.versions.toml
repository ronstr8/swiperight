[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.15.0"
# 2.17.0 is the last org.tensorflow TFLite release and the last one that ships
# the NNAPI delegate. The model is verified against the same kernels in
# tools/convert/verify_tflite.py (tensorflow-cpu 2.17.0). Changing this version
# means re-running tools/build_model.sh and the on-device benchmark.
tflite = "2.17.0"
junit = "4.13.2"
orgJson = "20240303"
androidxTestRunner = "1.6.2"
androidxTestExtJunit = "1.2.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
tflite = { group = "org.tensorflow", name = "tensorflow-lite", version.ref = "tflite" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
